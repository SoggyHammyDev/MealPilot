version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: soggyhammy-mealpilot_web_1
      APP_PORT: 3000
      # MCP applies its own bearer-token authentication. This allows machine
      # clients to reach /mcp without Umbrel's browser-login redirect.
      PROXY_AUTH_WHITELIST: "/mcp"

  web:
    image: ghcr.io/soggyhammydev/mealpilot:0.2.0
    restart: on-failure
    init: true
    stop_grace_period: 20s
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      DATA_DIR: "/data"
      MCP_AUTH_MODE: "token"
    volumes:
      - ${APP_DATA_DIR}/data:/data
