version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: soggyhammy-mealpilot_web_1
      APP_PORT: 3000
      # MCP applies its own bearer-token authentication. This allows machine
      # clients to reach /mcp without Umbrel's browser-login redirect.
      PROXY_AUTH_WHITELIST: "/mcp"

  web:
    image: ghcr.io/soggyhammydev/mealpilot:0.3.1
    restart: on-failure
    init: true
    stop_grace_period: 20s
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      DATA_DIR: "/data"
      MCP_AUTH_MODE: "token"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen3:4b-instruct"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.33.3
    restart: on-failure
    init: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - ${APP_DATA_DIR}/ollama:/root/.ollama
