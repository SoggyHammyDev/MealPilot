manifestVersion: 1.1
id: soggyhammy-mealpilot
category: automation
name: MealPilot
version: "0.3.1"
tagline: Private local-AI meal planning with no API key required
description: >-
  MealPilot is a private meal planner for Umbrel with built-in local AI and
  optional MCP integration. Set your daily calorie target, serving count,
  dietary preferences, allergies, foods to avoid, pantry ingredients, budget
  guidance, and maximum cooking time, then generate a complete meal plan
  directly in the app. MealPilot runs Ollama locally alongside the web app and
  uses structured JSON output so each saved meal includes calories, exact
  ingredient quantities, preparation time, cooking time, and step-by-step
  instructions. Repeated ingredients are combined into a grocery list. Ollama
  cloud features are disabled, and MealPilot does not require or store an
  OpenAI API key. The built-in Streamable HTTP MCP server remains available for
  ChatGPT and other compatible AI clients to read preferences and manage plans.
developer: SoggyHammyDev
website: https://github.com/SoggyHammyDev/MealPilot
repo: https://github.com/SoggyHammyDev/MealPilot
support: https://github.com/SoggyHammyDev/MealPilot/issues
dependencies: []
gallery: []
port: 4788
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  v0.3.1 improves local generation reliability when a meal violates the maximum
  prep + cook time. MealPilot now gives Ollama dynamic time bounds, includes the
  failed output during repair, clearly identifies the offending time arithmetic,
  and retries up to four times while instructing the model to replace recipes
  that cannot realistically fit the limit. No API key is required.
